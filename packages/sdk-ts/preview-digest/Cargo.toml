[package]
name = "opencut-preview-digest"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["wasm32_simd"] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
