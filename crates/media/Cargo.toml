[package]
name = "opencut-media"
description = "Native FFmpeg media backend for OpenCut"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Exact Matroska packet timing; vendored metadata-only upstream patch and licenses retained.
matroska-demuxer = { path = "vendor/matroska-demuxer", version = "=0.8.1" }
opencut-media-contracts = { path = "../media-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-script = "0.5"
tempfile = "3"
sha2 = "0.10"
# Native decode uses bounded custom AVIO; URL/device/network input is disabled.
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
