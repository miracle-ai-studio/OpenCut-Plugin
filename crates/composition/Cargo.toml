[package]
name = "opencut-composition"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencut-contracts = { path = "../contracts" }
opencut-media-contracts = { path = "../media-contracts" }
opencut-editor-core = { path = "../editor-core" }
opencut-time = { path = "../time" }
serde = { version = "1", features = ["derive"] }
# Private compiled audio gain deserialization preserves the exact JSON number
# lexeme and uses std's correctly rounded f64 parser. No global parser change.
serde_json = { version = "1", features = ["raw_value"] }
schemars = "1"
